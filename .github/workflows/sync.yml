name: Canvas Sync

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger sync
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/sync")
          code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          echo "Status: $code"
          echo "Body: $body"
          [ "$code" = "200" ] || exit 1

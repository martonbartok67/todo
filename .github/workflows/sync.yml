name: Canvas Sync

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Phase 1: pull courses + tasks only. Fast (~10–15s) and always
      # finishes well inside Vercel Hobby's 60s serverless ceiling.
      - name: Sync courses + tasks
        id: tasks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL:     ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/sync?phase=tasks")
          code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          echo "Status: $code"
          echo "Body: $body"
          [ "$code" = "200" ] || exit 1
          # Stash courseIds for the next step.
          echo "$body" > tasks_response.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("tasks_response.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `course_ids=${JSON.stringify(j.courseIds||[])}\n`); console.log("courseIds:", JSON.stringify(j.courseIds||[]));'

      # Phase 2: extract readings one course at a time. Each call is its own
      # serverless invocation, so even the worst case stays under 60s.
      - name: Extract readings per course
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL:     ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          ids='${{ steps.tasks.outputs.course_ids }}'
          # JSON array like ["56744","57921"] → bash-friendly string.
          ids="${ids#[}"; ids="${ids%]}"; ids="${ids//\"/}"
          IFS=',' read -ra ARR <<< "$ids"
          if [ "${#ARR[@]}" -eq 0 ] || [ -z "${ARR[0]}" ]; then
            echo "No courses to process — skipping AI phase."
            exit 0
          fi
          for cid in "${ARR[@]}"; do
            echo "---- POST $APP_URL/api/sync?phase=ai&courseId=$cid ----"
            response=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/sync?phase=ai&courseId=$cid" || true)
            code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | head -n -1)
            echo "Status: $code"
            echo "Body: $body"
          done
          echo "AI extraction pass complete."
